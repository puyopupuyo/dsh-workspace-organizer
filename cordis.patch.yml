# dsh-workspace-organizer bundle 层：插入本插件行。
#
# 通过官方 CLI 安装时（dsh plugin --profile <name> add <spec>），安装器会把本包
# 追加进 dsh.profile.bundles，并在启动时合并本补丁；等价于在 profile 的
# cordis.patch.yml 里手工挂载：
#
#   - insert:
#       - id: workspace-organizer
#         name: 'dsh-workspace-organizer'
- insert:
    - id: workspace-organizer
      name: 'dsh-workspace-organizer'
